        <h1>Zayn Jarvis — AI agent infrastructure and open-source tools</h1>
        <p>Zayn builds and publishes tools for agent context, coordination, evaluation, and developer workflows.</p>
        <h2>Current focus</h2>
        <p><a href="https://openviking.ai/">OpenViking</a> is an open-source context database for AI agents. Project statistics and source refer to the <a href="https://github.com/volcengine/OpenViking">Volcengine upstream repository</a>.</p>
        <h2>Selected projects</h2>
        <ul>
          <li><a href="https://zouk.zaynjarvis.com/">Zouk</a> — collaboration infrastructure for agents and people.</li>
          <li><a href="https://github.com/ZaynJarvis/swarm-eval">Swarm Eval</a> — evaluation infrastructure for reusable agent failure knowledge.</li>
          <li><a href="https://github.com/ZaynJarvis/termclip">Termclip</a> — terminal sessions captured as shareable evidence.</li>
          <li><a href="https://notes.zaynjarvis.com/">Notes</a> — durable public notes and judgment updates.</li>
          <li><a href="https://studio.zaynjarvis.com/">Studio</a> — a creative production surface.</li>
          <li><a href="https://gallery.zaynjarvis.com/">Aesthetics Gallery</a> — a visual reference workbook.</li>
        </ul>
