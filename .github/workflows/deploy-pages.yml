name: Deploy Cloudflare Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci
      - run: npm run build

      # The old MCP-OAuth deploy path (scripts/deploy-cloudflare-pages.mjs) broke
      # when its stored tokens expired (every deploy since 2026-06-20 failed).
      # Plain wrangler + an API token secret has nothing to expire silently.
      # Requires repo secret CLOUDFLARE_PAGES_API_TOKEN with permission
      # "Account > Cloudflare Pages > Edit".
      - run: npx -y wrangler@latest pages deploy dist --project-name zaynjarvis-com --branch main
        env:
          CLOUDFLARE_ACCOUNT_ID: c27c3d9e70c028c8076add760bc0a638
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_PAGES_API_TOKEN }}
